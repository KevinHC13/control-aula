<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Sin apple-touch-icon el ícono de la pantalla de inicio sale como una
         captura borrosa de la página. Va como link aparte porque Safari ha
         ignorado partes del manifest (docs/PWA-IOS.md). -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- El de arriba está deprecado y Chrome lo avisa, pero Safari todavía lo
         usa; el estándar es este. Van los dos hasta que Safari deje de pedirlo. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Palomita" />
    <meta name="theme-color" content="#1B4F9C" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Palomita</title>
    <!--
      La apariencia se aplica antes de pintar. Si esto esperara a que React monte,
      quien eligió el modo oscuro o el papel amarillo vería un destello blanco en cada
      arranque, y quien subió el tamaño de texto vería la interfaz saltar de tamaño.
      Son unas líneas que no pueden fallar: cualquier problema deja la apariencia de
      siempre.

      El color de la marca **no** va aquí, y es a propósito: un color libre hay que
      ajustarlo para que contraste, y esa cuenta no cabe en un script en línea. Lo
      pone React un cuadro después. Un acento que llega tarde no se nota; un fondo
      que cambia de color, sí.
    -->
    <script>
      try {
        var a = JSON.parse(localStorage.getItem('palomita.apariencia') || '{}')
        var r = document.documentElement
        var oscuro =
          a.modo === 'oscuro' ||
          (a.modo !== 'claro' && matchMedia('(prefers-color-scheme: dark)').matches)
        r.dataset.tema = oscuro ? 'oscuro' : 'claro'
        r.dataset.papel = a.papel === 'amarillo' ? 'amarillo' : 'blanco'
        // `cuadricula` es la preferencia vieja, de cuando esto era un interruptor.
        r.dataset.lineas =
          a.lineas || (a.cuadricula === false ? 'ninguna' : 'cuadricula')
        r.style.colorScheme = oscuro ? 'dark' : 'light'
        if (a.tamano === 'grande') r.style.fontSize = '112.5%'
        if (a.tamano === 'mayor') r.style.fontSize = '125%'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
